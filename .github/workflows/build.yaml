name: Build card

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        
      - name: Build card
        run: npm run build

      - name: Check JavaScript syntax
        run: npm run check

      - name: Upload built card
        uses: actions/upload-artifact@v7
        with:
          name: ha-district-heat-flow-card
          path: dist/ha-district-heat-flow-card.js
          if-no-files-found: error