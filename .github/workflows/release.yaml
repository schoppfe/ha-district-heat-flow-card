name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = pkg.version;

          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/, 'Invalid release version');
          assert.equal(lock.version, version, 'Lockfile version differs from package.json');
          assert.equal(lock.packages[''].version, version, 'Lockfile root version differs from package.json');
          if (process.env.RELEASE_EVENT === 'push') {
            assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match package.json');
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${version.includes('-')}\n`);
          console.log(`Validated version: ${version}`);
          JS

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check committed bundle
        run: git diff --exit-code -- dist/ha-district-heat-flow-card.js

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          options=()
          if [[ "$PRERELEASE" == "true" ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            dist/ha-district-heat-flow-card.js \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-from-tag \
            "${options[@]}"